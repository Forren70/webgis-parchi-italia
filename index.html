    <style>

        /* Area principale con padding */
        .main-content {
            flex-grow: 1;

        /* Riquadro della mappa con bordo nero sottile e posizionamento relativo per il pulsante interno */

            width: 100%;

        /* Pulsante archivio tabellare in sovrimpressione dentro la mappa (in alto a destra) */

            z-index: 1000;

            transition: background-color 0.2s ease;

        .archive-btn-overlay:hover {
            background-color: #2471a3;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Menu Laterale -->
        <nav class="sidebar">
            <div class="sidebar-header">WebGIS Parchi e Giardini Pubblici in Italia</div>
            <ul class="sidebar-menu">
                <li><a href="index.html" class="active">📍 Mappa Interattiva</a></li>
                <li><a href="archivio.php">📊 Archivio Tabellare</a></li>
                <li><a href="chisiamo.php">ℹ Chi siamo</a>
            </ul>
            
            <!-- Specifiche di Riferimento Spaziale Rigorose -->
            <div class="sidebar-footer">
                <strong>CRS del layer punti (ubicazione parchi e giardini pubblici):</strong> WGS 84 (EPSG:4326) in Gradi Decimali<br><br>
                <strong>CRS della basemap:</strong> Web Mercator (EPSG:3857)
            </div>
        </nav>

        <!-- Contenuto Destra con Riquadro e Margini -->
        <main class="main-content">
            <div class="map-container">
                <!-- Pulsante Archivio interno alla mappa (in alto a destra) -->
                <a href="archivio.php" class="archive-btn-overlay">📊 Vai all'Archivio Tabellare</a>
                <div id="map"></div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // 1. Inizializzazione della mappa con baricentro bilanciato [41.8, 12.5] a zoom 6
        var map = L.map('map').setView([41.8000, 12.5000], 6);

        // 2. Tile layer OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Lettura parametri URL (se si arriva dall'archivio)
        const urlParams = new URLSearchParams(window.location.search);
        const paramLat = urlParams.get('lat');
        const paramLon = urlParams.get('lon');
        const nomeParcoURL = urlParams.get('nome');

        // Se presenti lat e lon nell'URL, impostiamo il centro temporaneo sul singolo parco
        if (paramLat && paramLon) {
            map.setView([parseFloat(paramLat), parseFloat(paramLon)], 16);
        }

        // 3. Richiesta asincrona dei dati dall'endpoint PHP
        fetch('endpoint.php')
            .then(response => response.json())
            .then(data => {
                var markers = L.markerClusterGroup();

                data.forEach(parco => {
                    var lat = parco.Latitudine;
                    var lon = parco.Longitudine;
                    var nome = parco.Nome_parco_e_indirizzo || 'Parco';
                    var provincia = parco.Provincia || '';

                    if (lat && lon) {
                        var marker = L.marker([parseFloat(lat), parseFloat(lon)]);
                        marker.bindPopup("<b>Parco:</b> " + nome + "<br><b>Provincia:</b> " + provincia);
                        markers.addLayer(marker);
                    }
                });

                // Aggiunge tutti i marker raggruppati alla mappa
                map.addLayer(markers);

                // Se siamo arrivati cliccando dall'archivio, cerchiamo il marker corrispondente per aprirne il popup
                if (paramLat && paramLon) {
                    markers.eachLayer(function(layer) {
                        var pos = layer.getLatLng();
                        if (Math.abs(pos.lat - parseFloat(paramLat)) < 0.0001 && Math.abs(pos.lng - parseFloat(paramLon)) < 0.0001) {
                            layer.openPopup();
                        }
                    });
                }
            })
            .catch(error => console.error('Errore nel caricamento dei dati dei parchi:', error));

        // Fix per ridimensionamento mappa all'interno del riquadro
        setTimeout(function() {
            map.invalidateSize();
        }, 100);

        // Gestione click sul link "Chi siamo"
        document.querySelector('a[href="#"]:not(.active)').addEventListener('click', function(e) {
            e.preventDefault();
            alert("WebGIS Parchi e Giardini Pubblici in Italia\n\nRealizzato a ottobre 2026 da Renato Forte, tecnico GIS e studente del Master di II livello in Geomatica presso il CGT dell'Università di Siena (a.a. 2026), come verifica finale nell'ambito del modulo 'WebGIS e Database Spaziali' - Docente Daniele Simoncini.\n\nI dati relativi a ubicazione parchi e giardini pubblici in Italia sono stati ricavati dal file Parchi_E_Giardini.csv, scaricabile dal sito www.poigps.com (https://www.poigps.com/modules.php?name=Downloads&d_op=getit&lid=13). Tali dati non sono ufficiali e inclusivi di tutti i parchi e giardini pubblici, in quanto raccolti da utenti GPS e quindi non necessariamente completi e/o aggiornati.\n\nIl presente WebGIS costituisce semplice dimostrazione dell'utilizzo e potenzialità dei linguaggi HTML, CSS, JavaScript, PHP e della libreria Leaflet.");
        });
    </script>
</body>
</html>
